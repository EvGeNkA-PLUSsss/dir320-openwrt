name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build single-file installer
        run: python3 tools/build_installer.py

      - name: Syntax check (dash)
        run: |
          ls -l dist/
          sh -n dist/openwrt-installer.sh
          python3 -c "import sys; d=open('dist/openwrt-installer.sh','rb').read(); sys.exit(1 if b'\r' in d else 0)" && echo 'LF-only OK'

      - name: Sanity checks
        run: |
          grep -q 'УСТАНОВИТЬ' dist/openwrt-installer.sh
          grep -q 'owinst-sync-ftp' dist/openwrt-installer.sh
          ! grep -qi 'dir320\|DIR-320' dist/openwrt-installer.sh || { echo 'BUG: model-specific string'; exit 1; }
          echo OK

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-installer
          path: dist/openwrt-installer.sh
          if-no-files-found: error
